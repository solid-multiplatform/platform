android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters.clear()
            abiFilters.addAll(project.hasProperty('abis') ? project.property('abis').split(',').toList() : ['x86_64', 'arm64-v8a', 'armeabi-v7a'])
        }
    }
}
