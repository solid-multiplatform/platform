name: Foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: node --test tests/native/*.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:webgl
      - working-directory: examples/roku
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm lint
      - run: bash tests/cli/projects-smoke.sh
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: bash tests/cli/android-smoke.sh
  apple:
    strategy:
      fail-fast: false
      matrix:
        target: [ios, apple-tv]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Build generated Apple plugin project
        timeout-minutes: 20
        run: bash tests/cli/apple-smoke.sh ${{ matrix.target }} build
      - name: Invoke Swift command in simulator
        timeout-minutes: 12
        run: bash tests/cli/apple-smoke.sh ${{ matrix.target }} launch
