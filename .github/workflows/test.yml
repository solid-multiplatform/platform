name: Foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: node --test tests/native/*.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:webgl
      - working-directory: examples/roku
        run: pnpm install --frozen-lockfile && pnpm build
  tvos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - working-directory: examples/apple-tv
        run: pnpm install --frozen-lockfile
      - run: xcodebuild -downloadPlatform tvOS
      - working-directory: examples/apple-tv
        run: pnpm exec ns build tvos --emulator --env.production --no-hmr
