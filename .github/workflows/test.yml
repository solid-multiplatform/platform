name: Foundation
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/android.yml']
  pull_request:
    paths-ignore: ['.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or pull request supersedes the older run.
concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the Roku example so its tsconfig resolves for type-aware lint
        working-directory: packages/platform/examples/roku
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: The feature matrix is generated and its evidence exists
        run: pnpm docs:check && node --test scripts/*.test.mjs
      - name: Parse every host, CLI and video module
        run: |
          git ls-files 'packages/platform/hosts/**/*.mjs' 'packages/platform/cli/**/*.mjs' 'packages/video/*.mjs' |
            xargs -n1 node --check
  renderer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - working-directory: packages/platform
        run: |
          npm test
          npm run typecheck:native
          npm run typecheck:apple
          node --test tests/cli/variants.test.mjs
          python tests/performance/test_frame_timeline.py
          node --test tests/native/*.test.mjs
      - working-directory: packages/video
        run: npm test
  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      # The runner's Ubuntu mirror stalls often enough to fail a release:
      # retry apt, then retry the whole install once.
      - run: |
          set -euo pipefail
          install() {
            sudo apt-get update -o Acquire::Retries=5 ||
              sleep 15 && sudo apt-get update -o Acquire::Retries=5
            pnpm exec playwright install --with-deps chromium webkit
          }
          install || { sleep 20; install; }
      - name: WebGL and Canvas in Chromium and WebKit
        run: |
          pnpm test:webgl:chromium
          pnpm test:webgl:webkit
      - name: Compare actual Canvas and WebGL pixels
        run: node tests/visual/run.mjs "$RUNNER_TEMP/visual"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-visual-samples
          path: ${{ runner.temp }}/visual/*.png
          if-no-files-found: ignore
  # Firefox needs a software GL driver on a runner without a GPU, and the
  # hosted image does not give it one: every WebGL context fails with
  # FEATURE_FAILURE_WEBGL_EXHAUSTED_DRIVERS even with Mesa installed and
  # llvmpipe forced. No TV vendor engine is Firefox (Tizen, webOS and Vizio
  # are Chromium; Safari and ipadOS are WebKit), so this job is a bonus and
  # does not block a merge; it runs so a future runner image can turn it on.
  browser-firefox:
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      - run: pnpm exec playwright install --with-deps firefox
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libegl-mesa0 libglx-mesa0
      - name: WebGL and Canvas in Firefox
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: pnpm test:webgl:firefox
  # The browser-TV targets only ever run in Chromium today. The showcase is
  # the app-level walk (keyboard, mouse, ARIA, every service probe, and the
  # two-second idle rule), so it runs in each engine; WebKit also covers
  # Safari, which an iPad or a TV browser embeds.
  showcase:
    name: showcase (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    # Firefox gets no software WebGL on this runner (see browser-firefox):
    # it runs so the walk is exercised where it can be, but does not block.
    continue-on-error: ${{ matrix.engine == 'firefox' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      - run: |
          set -euo pipefail
          install() {
            sudo apt-get update -o Acquire::Retries=5 ||
              sleep 15 && sudo apt-get update -o Acquire::Retries=5
            pnpm --dir apps/showcase exec playwright install --with-deps ${{ matrix.engine }}
          }
          install || { sleep 20; install; }
      # Headless Firefox has no GPU and needs a software rasteriser.
      - if: matrix.engine == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libegl-mesa0 libglx-mesa0
      - run: pnpm --dir apps/showcase run test:${{ matrix.engine }}
  projects:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      - working-directory: packages/platform/examples/roku
        run: pnpm install --frozen-lockfile && pnpm build
      # The runner's Ubuntu mirror stalls often enough to fail a release:
      # retry apt, then retry the whole install once.
      - run: |
          set -euo pipefail
          install() {
            sudo apt-get update -o Acquire::Retries=5 ||
              sleep 15 && sudo apt-get update -o Acquire::Retries=5
            pnpm exec playwright install --with-deps chromium
          }
          install || { sleep 20; install; }
      - run: bash tests/cli/projects-smoke.sh
  apple:
    strategy:
      fail-fast: false
      matrix:
        target: [ios, apple-tv]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: packages/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run build
      - name: Build generated Apple plugin project
        timeout-minutes: 20
        run: bash tests/cli/apple-smoke.sh ${{ matrix.target }} build
      - name: Invoke Swift command in simulator
        timeout-minutes: 12
        run: bash tests/cli/apple-smoke.sh ${{ matrix.target }} launch
