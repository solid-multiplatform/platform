name: Desktop runtime
# Builds the native desktop runtime (Hermes, SDL3, the GL surface) and runs
# every test of the desktop host on a virtual display with software GL.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packages/host-desktop/**'
      - '.github/workflows/desktop-runtime.yml'
  pull_request:
    paths:
      - 'packages/host-desktop/**'
      - '.github/workflows/desktop-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Hermes, branch static_h, at the commit the runtime was built and tested
  # with. build.rs carries the compile flags of this commit's default Release
  # configuration: move both together.
  HERMES_SHA: e5c781e67e2cb950d9d761a51d3788e73d1ad0b3
  # The SDL release the sdl3-sys crate in Cargo.lock was generated from. The
  # runner image has no SDL3 package, so it is built from the release tarball.
  SDL_VERSION: 3.4.20
  SDL_SHA256: f3bb06f55bed9557227a700af2ea62e49497ebdf58037732a731a5fb3ef8581f
  # Where system packages come from when the runner's own mirror stalls.
  APT_MIRRORS: https://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: System packages
        run: |
          set -euo pipefail
          # A compiler and build tools; what SDL's X11, Wayland and D-Bus
          # support is built against; a virtual display, Mesa's software GL
          # and xdotool for the tests; a session bus, the accessibility bus
          # with its registry, and Python's GLib bindings (the stand-in for
          # a notification service) for the tests on a bus of their own.
          packages="build-essential cmake ninja-build pkg-config python3
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
            libwayland-dev wayland-protocols libdecor-0-dev
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev
            libdbus-1-dev libibus-1.0-dev libudev-dev
            xvfb xauth xdotool openssl libgl1-mesa-dri libegl1 libgles2
            at-spi2-core python3-gi gir1.2-glib-2.0"
          # From this runner, downloads from the package mirrors over plain
          # HTTP stop in the middle and apt waits on them for many minutes,
          # while everything fetched over HTTPS arrives. So the mirrors are
          # asked over HTTPS; and should the downloads, which normally take
          # a quarter of a minute, still not be there after a minute and a
          # half, they are stopped (only downloads: nothing is being
          # installed yet) and fetched from another mirror, which the rest
          # of the job then uses.
          sudo sed -i -E 's|http://([^ ]*ubuntu\.com/ubuntu)|https://\1|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          fetch() {
            sudo timeout 60 apt-get update &&
              sudo timeout 90 apt-get install -y --download-only --no-install-recommends $packages
          }
          if ! fetch; then
            for mirror in $APT_MIRRORS; do
              echo "::warning::The package mirror did not deliver in time: using $mirror"
              sudo sed -i -E "s|https?://[^ ]*ubuntu\.com/ubuntu/?|$mirror|g" \
                /etc/apt/sources.list.d/ubuntu.sources
              if fetch; then break; fi
            done
          fi
          # From what was downloaded. Nothing may stop to ask: not a
          # package's questions, and not the restart of services whose
          # libraries were replaced.
          sudo timeout 600 env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 \
            apt-get install -y --no-install-recommends $packages
          # The image has a session bus daemon; the tests need it.
          command -v dbus-daemon busctl

      # The Hermes and SDL builds are saved as soon as they are made, not at
      # the end of the job: a later step that fails must not cost the next
      # run twenty minutes of compiling Hermes again.
      - name: Hermes build cache
        id: hermes
        uses: actions/cache/restore@v4
        with:
          path: |
            hermes
            hermes-build
          key: hermes-${{ runner.os }}-${{ runner.arch }}-${{ env.HERMES_SHA }}
      - name: Build Hermes
        if: steps.hermes.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q hermes
          git -C hermes remote add origin https://github.com/facebook/hermes
          git -C hermes fetch -q --depth 1 origin "$HERMES_SHA"
          git -C hermes checkout -q FETCH_HEAD
          test "$(git -C hermes rev-parse HEAD)" = "$HERMES_SHA"
          cmake -S hermes -B hermes-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHERMES_ENABLE_INTL=OFF
          ninja -C hermes-build hermesvm hermesNapi
      - name: Save the Hermes build
        if: steps.hermes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            hermes
            hermes-build
          key: ${{ steps.hermes.outputs.cache-primary-key }}

      - name: SDL build cache
        id: sdl
        uses: actions/cache/restore@v4
        with:
          path: sdl
          key: sdl-${{ runner.os }}-${{ runner.arch }}-${{ env.SDL_VERSION }}
      - name: Build SDL
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL -o SDL3.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz"
          echo "$SDL_SHA256  SDL3.tar.gz" | sha256sum -c -
          tar -xzf SDL3.tar.gz
          cmake -S "SDL3-$SDL_VERSION" -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl" -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          ninja -C sdl-build install
      - name: Save the SDL build
        if: steps.sdl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sdl
          key: ${{ steps.sdl.outputs.cache-primary-key }}
      - name: Use the built SDL
        run: |
          set -euo pipefail
          lib=$(dirname "$(find "$PWD/sdl" -name sdl3.pc)")
          echo "PKG_CONFIG_PATH=$lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/host-desktop/native/target
          key: desktop-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.HERMES_SHA }}-${{ env.SDL_VERSION }}-${{ hashFiles('packages/host-desktop/native/Cargo.lock') }}
      - name: Build the runtime
        working-directory: packages/host-desktop/native
        run: |
          export HERMES_SRC="$GITHUB_WORKSPACE/hermes" HERMES_BUILD="$GITHUB_WORKSPACE/hermes-build"
          cargo build --release --locked
          ls -l target/release/solid-desktop
          ./target/release/solid-desktop --diagnostics
          # The runtime's unit tests, with the dependencies just built.
          cargo test --release --locked

      - run: pnpm install --frozen-lockfile
      # The scene test compares the runtime's frame with Chromium's. Its
      # system packages come through apt as well: the same patience, and
      # the same way out.
      - name: Chromium
        working-directory: packages/platform
        run: |
          set -euo pipefail
          # As root, so that stopping it stops the apt it started.
          packages() {
            sudo timeout 240 env "PATH=$PATH" ./node_modules/.bin/playwright install-deps chromium
          }
          if ! packages; then
            mirror=${APT_MIRRORS%% *}
            echo "::warning::Chromium's packages did not arrive in four minutes: using $mirror"
            sudo sed -i -E "s|https?://[^ ]*ubuntu\.com/ubuntu/?|$mirror|g" \
              /etc/apt/sources.list.d/ubuntu.sources
            # In case the wait ended while a package was being unpacked.
            sudo dpkg --configure -a
            packages
          fi
          pnpm exec playwright install chromium
      - name: Test
        env:
          # Here the tests that need a bus of their own must run, not skip.
          SOLID_DESKTOP_REQUIRE_A11Y: 1
          SOLID_DESKTOP_REQUIRE_DBUS: 1
        run: bash packages/host-desktop/tests/run.sh

      # The runtime that ships: SDL compiled in, so an app needs none
      # installed. Packaged, moved and run like the one above, without the
      # SDL built for it on the library path.
      - name: Build the runtime with SDL linked in
        working-directory: packages/host-desktop/native
        run: |
          set -euo pipefail
          export HERMES_SRC="$GITHUB_WORKSPACE/hermes" HERMES_BUILD="$GITHUB_WORKSPACE/hermes-build"
          cargo build --release --locked --features static-sdl --target-dir target/static
          ls -l target/static/release/solid-desktop
          env -u LD_LIBRARY_PATH ./target/static/release/solid-desktop --diagnostics
          if env -u LD_LIBRARY_PATH ldd target/static/release/solid-desktop | grep -i sdl; then
            echo "SDL is still a shared library of this build" >&2
            exit 1
          fi
      - name: Test a package of it
        run: |
          set -euo pipefail
          mkdir -p packages/host-desktop/prebuilt/linux-x64
          cp packages/host-desktop/native/target/static/release/solid-desktop packages/host-desktop/prebuilt/linux-x64/
          env -u LD_LIBRARY_PATH \
            SOLID_DESKTOP_RUNTIME="$PWD/packages/host-desktop/prebuilt/linux-x64/solid-desktop" \
            SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a -s "-screen 0 1280x720x24" node packages/host-desktop/tests/package/run.mjs
      # Put at packages/host-desktop/prebuilt/linux-x64/solid-desktop and
      # made executable again (an artifact does not keep that), this is the
      # prebuilt runtime that cli/runtime.mjs finds.
      - name: Archive the runtime for the release
        run: |
          set -euo pipefail
          tar -czf solid-desktop-linux-x64.tar.gz -C packages/host-desktop/prebuilt/linux-x64 solid-desktop
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf solid-desktop-linux-x64.tar.gz -C "$RUNNER_TEMP/unpacked"
          env -u LD_LIBRARY_PATH "$RUNNER_TEMP/unpacked/solid-desktop" --diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: solid-desktop-linux-x64
          path: solid-desktop-linux-x64.tar.gz
          if-no-files-found: error

  # macOS arm64. The runner has Xcode's clang, CMake and Ninja, and
  # `static-sdl` builds SDL (Cocoa, OpenGL through EGL) from source, so
  # nothing has to be installed. The headless tests run everywhere; a window
  # is not opened because macOS supplies no OpenGL ES driver of its own (see
  # docs/targets/desktop.md).
  #
  # continue-on-error: this job has never run before, and a first failure
  # must not hide the Linux result or block the release of the Linux
  # runtime. Remove it once it has been green.
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          set -euo pipefail
          command -v cmake ninja clang++ git
          rustc --version
          rustup target list --installed | grep aarch64-apple-darwin
      - name: Hermes build cache
        id: hermes
        uses: actions/cache/restore@v4
        with:
          path: |
            hermes
            hermes-build
          # `macos11`: the deployment target is part of the build, and an
          # archive made for the runner's own macOS fails the link below.
          key: hermes-${{ runner.os }}-${{ runner.arch }}-${{ env.HERMES_SHA }}-macos11
      - name: Build Hermes
        if: steps.hermes.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git init -q hermes
          git -C hermes remote add origin https://github.com/facebook/hermes
          git -C hermes fetch -q --depth 1 origin "$HERMES_SHA"
          git -C hermes checkout -q FETCH_HEAD
          test "$(git -C hermes rev-parse HEAD)" = "$HERMES_SHA"
          # The same configuration as Linux (`-DHERMES_ENABLE_INTL=OFF`),
          # for this runner's architecture. The deployment target is the
          # one Rust targets by default: without it Hermes and SDL objects
          # are built for the runner's macOS (15.x) and the link against a
          # binary for 11.0 fails on compiler-rt's availability symbol.
          export MACOSX_DEPLOYMENT_TARGET=11.0
          cmake -S hermes -B hermes-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DHERMES_ENABLE_INTL=OFF
          ninja -C hermes-build hermesvm hermesNapi
      - name: Save the Hermes build
        if: steps.hermes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            hermes
            hermes-build
          key: ${{ steps.hermes.outputs.cache-primary-key }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/host-desktop/native/target
          # `macos11` keeps SDL and the glue compiled for the same target as
          # Hermes; a target directory built for 15.x would not be reused.
          key: desktop-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.HERMES_SHA }}-static-macos11-${{ hashFiles('packages/host-desktop/native/Cargo.lock') }}
      - name: Build the runtime
        working-directory: packages/host-desktop/native
        run: |
          set -euo pipefail
          export HERMES_SRC="$GITHUB_WORKSPACE/hermes" HERMES_BUILD="$GITHUB_WORKSPACE/hermes-build"
          # The same floor Hermes was built with: the glue, the SDL that
          # `sdl3-sys` compiles and rustc itself must agree on it, or the
          # link mixes objects for two macOS versions.
          export MACOSX_DEPLOYMENT_TARGET=11.0
          echo "SDK $(xcrun --show-sdk-version) at $(xcrun --show-sdk-path)"
          cc --version | head -1
          cc --print-libgcc-file-name
          # SDL is compiled into the executable: the runner has none.
          cargo build --release --locked --features static-sdl
          ./target/release/solid-desktop --diagnostics
          cargo test --release --locked --features static-sdl
      - name: Test (headless)
        run: |
          set -euo pipefail
          SOLID_DESKTOP_HEADLESS_ONLY=1 bash packages/host-desktop/native/tests/run.sh
      - name: Archive the runtime for the release
        run: |
          set -euo pipefail
          tar -czf solid-desktop-darwin-arm64.tar.gz \
            -C packages/host-desktop/native/target/release solid-desktop
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf solid-desktop-darwin-arm64.tar.gz -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/solid-desktop" --diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: solid-desktop-darwin-arm64
          path: solid-desktop-darwin-arm64.tar.gz
          if-no-files-found: error

  # Windows x64 (MSVC). `static-sdl` builds SDL (Win32, D3D, WGL and the EGL
  # path for OpenGL ES) from source. The headless tests run; a window is not
  # opened, since a hosted runner has no GPU and no GL ES driver guaranteed.
  #
  # continue-on-error: same reason as the macOS job.
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cl.exe cmake.exe ninja.exe git.exe tar.exe
          rustc --version
          rustup target list --installed | grep x86_64-pc-windows-msvc
      - name: Hermes build cache
        id: hermes
        uses: actions/cache/restore@v4
        with:
          path: |
            hermes
            hermes-build
          key: hermes-${{ runner.os }}-${{ runner.arch }}-${{ env.HERMES_SHA }}-msvc
      - name: Build Hermes
        if: steps.hermes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init -q hermes
          git -C hermes remote add origin https://github.com/facebook/hermes
          git -C hermes fetch -q --depth 1 origin "$HERMES_SHA"
          git -C hermes checkout -q FETCH_HEAD
          test "$(git -C hermes rev-parse HEAD)" = "$HERMES_SHA"
          # At this SHA two Node-API test addons are both named test_exception.
          # Ninja with MSVC writes every import library into the same binary
          # directory and refuses to generate two rules for one path, before
          # it knows which targets will be built. Give each addon's archive a
          # directory under its own category. Build-system only: no VM code is
          # touched, and none of these test addons is built or shipped.
          sed -i 's|^    RUNTIME_OUTPUT_DIRECTORY_RELEASE ${ADDON_OUTPUT_DIR}$|    RUNTIME_OUTPUT_DIRECTORY_RELEASE ${ADDON_OUTPUT_DIR}\n    ARCHIVE_OUTPUT_DIRECTORY ${ADDON_OUTPUT_DIR}|' \
            hermes/external/node-api-tests/hermes/CMakeLists.txt
          grep -n "ARCHIVE_OUTPUT_DIRECTORY" hermes/external/node-api-tests/hermes/CMakeLists.txt
          cmake -S hermes -B hermes-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHERMES_ENABLE_INTL=OFF
          ninja -C hermes-build hermesvm hermesNapi
      - name: Save the Hermes build
        if: steps.hermes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            hermes
            hermes-build
          key: ${{ steps.hermes.outputs.cache-primary-key }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/host-desktop/native/target
          key: desktop-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.HERMES_SHA }}-static-${{ hashFiles('packages/host-desktop/native/Cargo.lock') }}
      - name: Build the runtime
        working-directory: packages/host-desktop/native
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_SRC="$GITHUB_WORKSPACE/hermes" HERMES_BUILD="$GITHUB_WORKSPACE/hermes-build"
          # Git Bash puts its own link.exe (coreutils' hard-link tool) on PATH
          # ahead of MSVC's, and rustc would run that. Name MSVC's linker,
          # beside the cl.exe that the MSVC environment step selected.
          export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="$(dirname "$(command -v cl.exe)")/link.exe"
          cargo build --release --locked --features static-sdl
          ./target/release/solid-desktop.exe --diagnostics
          cargo test --release --locked --features static-sdl
      - name: Test (headless)
        shell: bash
        run: |
          set -euo pipefail
          SOLID_DESKTOP_HEADLESS_ONLY=1 bash packages/host-desktop/native/tests/run.sh
      - name: Archive the runtime for the release
        shell: bash
        run: |
          set -euo pipefail
          tar -czf solid-desktop-win32-x64.tar.gz \
            -C packages/host-desktop/native/target/release solid-desktop.exe
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf solid-desktop-win32-x64.tar.gz -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/solid-desktop.exe" --diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: solid-desktop-win32-x64
          path: solid-desktop-win32-x64.tar.gz
          if-no-files-found: error

  # The release workflow creates the release for the same tag; this job adds
  # the runtime archives to it. Both workflows start on the tag, so the
  # release is waited for rather than assumed to exist. A platform that has
  # not produced its archive yet (a job still failing) is simply missing
  # from this release; the next one carries it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: solid-desktop-*
          path: assets
          merge-multiple: true
      - name: Attach the runtimes to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l assets
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" assets/*.tar.gz --clobber
